name: Discord announcements

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      update_message:
        description: 'RO/EN update announcement (empty sends a test without ping)'
        type: string
        required: false

permissions: {}

jobs:
  notify:
    if: github.event_name != 'release' || !contains(github.event.release.body, '<!-- skip-discord -->')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_MENTION: everyone
    steps:
      - name: Check webhook configuration
        if: env.DISCORD_WEBHOOK_URL == ''
        run: |
          echo "::error::Configure DISCORD_WEBHOOK_URL to send announcements / Configurati DISCORD_WEBHOOK_URL pentru anunturi."
          exit 1

      - name: Send NyriumSkins announcement
        if: env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const kind = process.env.GITHUB_EVENT_NAME;
            if (kind === 'push' && event.deleted) return;
            const url = new URL(process.env.DISCORD_WEBHOOK_URL);
            if (url.protocol !== 'https:' || url.hostname !== 'discord.com' ||
                !/^\/api(?:\/v\d+)?\/webhooks\/\d+\/[^/]+\/?$/.test(url.pathname)) {
              throw new Error('Invalid Discord webhook configuration.');
            }
            url.searchParams.set('wait', 'true');
            const repository = process.env.GITHUB_REPOSITORY;
            const repoUrl = `https://github.com/${repository}`;
            const update = kind === 'workflow_dispatch' && String(event.inputs?.update_message || '').trim();
            const release = kind === 'release' || Boolean(update);
            if (update) event.release = { tag_name: '0.2.1', prerelease: true, html_url: `${repoUrl}/releases/tag/v0.2.1`, body: update };
            const limit = (value, max) => String(value ?? '').slice(0, max);
            const escape = value => limit(value, 180).replace(/[\\`*_~\[\]<>]/g, '\\$&');
            const commits = Array.isArray(event.commits) ? event.commits : [];
            const embed = {
              author: { name: 'NYRIUM-SKINS', url: 'https://nyrium.global' },
              title: release ? limit(`NyriumSkins ${event.release.tag_name}${event.release.prerelease ? ' BETA' : ''} | ${update ? 'Actualizare / Update' : 'Versiune noua / New release'}`, 256)
                : 'NyriumSkins | Test notificare / Notification test',
              url: release ? event.release.html_url : (event.compare || repoUrl),
              color: release ? 0xD4AF37 : 0x54C7DB,
              description: release
                ? limit(event.release.body || 'RO: Detalii si instalare in release.\nEN: See the release for details and installation.', 3000)
                : kind === 'push'
                  ? commits.slice(-6).map(c => `[${c.id.slice(0, 7)}](${repoUrl}/commit/${c.id}) ${escape(c.message.split('\n')[0])}`).join('\n') || 'The main branch has been updated.'
                  : 'RO: Test de conectare fara mentionarea membrilor.\nEN: Connection test without pinging members.',
              fields: [
                { name: 'Proiect / Project', value: `[NyriumSkins](${repoUrl})`, inline: true },
                { name: 'Publicat de / Published by', value: escape(event.sender?.login || process.env.GITHUB_ACTOR), inline: true },
                { name: 'Bug-uri / Bugs', value: 'RO: Creati un ticket pe Discord cu pasii, logurile si capturile.\nEN: Open a Discord ticket with steps, logs and screenshots.\nNu trimiteti parole/tokenuri. Never share passwords/tokens.' },
                { name: 'Links', value: `[Website](https://nyrium.global) | [Discord](https://discord.gg/FmGBPWTkDP) | [Releases](${repoUrl}/releases)` }
              ],
              footer: { text: release ? 'NyriumSkins | Release announcement' : 'NyriumSkins | Development activity' },
              timestamp: new Date().toISOString()
            };
            const allowed = { parse: [], users: [], roles: [] };
            let mention = '';
            const ping = release;
            const configured = process.env.DISCORD_MENTION || '';
            if (ping && configured === 'everyone') { mention = '@everyone'; allowed.parse = ['everyone']; }
            else if (ping && /^\d{17,20}$/.test(configured)) { mention = `<@&${configured}>`; allowed.roles = [configured]; }
            const payload = {
              username: 'NyriumSkins Updates',
              content: `${mention}${mention ? '\n' : ''}${release ? 'RO: O noua versiune NyriumSkins este disponibila!\nEN: A new NyriumSkins version is available!' : 'RO: Test notificare.\nEN: Notification test.'}`,
              allowed_mentions: allowed,
              embeds: [embed]
            };
            const response = await fetch(url, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload), signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error(`Discord returned HTTP ${response.status}.`);
            console.log('Discord announcement delivered.');
          }
          main().catch(error => {
            // Never log webhook URLs, HTTP bodies or commit-supplied content on failure.
            console.error(error.message.startsWith('Discord returned HTTP') ? error.message : 'Discord announcement failed; verify the webhook secret and connection.');
            process.exitCode = 1;
          });
          NODE
